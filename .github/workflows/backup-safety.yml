name: VEXTOR backup safety checks

on:
  push:
    branches:
      - fix/backup-supabase-storage
  pull_request:
    branches:
      - main

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vextor_be
    env:
      DATABASE_URL: sqlite:///./ci_test.db
      JWT_SECRET_KEY: ci-only-test-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: vextor_be/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest httpx
      - name: Run backend tests
        run: python -m pytest -q

  backup-specific-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vextor_be
    env:
      DATABASE_URL: sqlite:///./ci_test.db
      JWT_SECRET_KEY: ci-only-test-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: vextor_be/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest httpx
      - name: Run backup safety tests
        run: python -m pytest -q tests/test_backup_restore.py tests/test_backup_service.py tests/test_backup_storage.py

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vextor_fe
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: vextor_fe/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        run: pnpm build
