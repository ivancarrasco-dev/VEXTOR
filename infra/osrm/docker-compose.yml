name: vextor-osrm

services:
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v26.7.3-debian
    command: osrm-routed --algorithm mld --ip 0.0.0.0 --port 5000 /data/colombia-latest.osrm
    ports:
      - "5000:5000"
    volumes:
      - ./data:/data
    restart: unless-stopped

  # Herramienta bajo demanda para preparar o actualizar el grafo; no inicia con `up`.
  osrm-tools:
    image: ghcr.io/project-osrm/osrm-backend:v26.7.3-debian
    profiles: ["tools"]
    volumes:
      - ./data:/data
